name: Fetch YouTube titles

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch titles via YouTube oEmbed
        run: node scripts/fetch-titles.mjs
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/videos/titles.json
          git diff --cached --quiet || git commit -m "chore: update video titles from YouTube oEmbed"
          git push
