name: Fetch YouTube titles

# The dev sandbox that authors this wiki has no route to youtube.com, so
# video titles are fetched here (oEmbed, no API key) and committed to
# data/videos/titles.json. Trigger manually or by editing the fetch script.
# Note: the source PDFs on Google Drive are NOT publicly link-shared (Drive
# answers with a sign-in redirect), so nothing here downloads from Drive —
# PDF text and link extraction happens via the authenticated Drive connector
# in the authoring session instead (see canonical/README.md).

on:
  workflow_dispatch:
  push:
    branches:
      - claude/pdf-wiki-carbon-nuxt-u9todg
    paths:
      - scripts/fetch-titles.mjs
      - .github/workflows/fetch-titles.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch titles via YouTube oEmbed
        run: node scripts/fetch-titles.mjs
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add data/videos/titles.json
          git diff --cached --quiet || git commit -m "chore: update video titles from YouTube oEmbed [skip ci]"
          git push
