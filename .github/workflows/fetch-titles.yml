name: Fetch YouTube titles

on:
  workflow_dispatch:
  push:
    branches:
      - claude/pdf-wiki-carbon-nuxt-u9todg
    paths:
      - scripts/fetch-titles.mjs
      - scripts/extract_pdf_links.py
      - .github/workflows/fetch-titles.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract PDF link annotations from Drive PDFs
        run: |
          pip install --quiet gdown pypdf pdfplumber
          python scripts/extract_pdf_links.py
      - name: Fetch titles via YouTube oEmbed
        run: node scripts/fetch-titles.mjs
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase
          git add data/videos/titles.json canonical/*-plan-links.json
          git diff --cached --quiet || git commit -m "chore: update PDF link extractions and video titles [skip ci]"
          git push
